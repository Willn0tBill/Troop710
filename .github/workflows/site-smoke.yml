name: Troop 710 site smoke tests

on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'tests/test_site_smoke.py'
      - '.github/workflows/site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test desktop, mobile, search, and motion preferences
        run: python -m unittest discover -s tests -p 'test_site_smoke.py' -v
