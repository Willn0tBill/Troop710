name: Sync TroopWebHost public documents

on:
  # Check new public uploads and reconcile replacements/deletions every six hours.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public-documents.yml'
      - 'scripts/sync_twh_public.py'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-public-documents.yml'
      - 'scripts/sync_twh_public.py'
      - 'tests/test_sync_twh_public.py'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_sync_twh_public.py' -v

  # Read-only PR verification: exercise the live anonymous source without publishing.
  verify-public-source:
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Validate TroopWebHost anonymous public listings (no deployment)
        run: python scripts/sync_twh_public.py

  sync:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: troop710-public-documents
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Read anonymous TroopWebHost public document directory
        run: python scripts/sync_twh_public.py
      - name: Publish updates only when links changed
        run: |
          if ! git diff --quiet -- forms.html search-index.json || [[ -n "$(git ls-files --others --exclude-standard -- troopwebhost-public-state.json)" ]]; then
            git config user.name "troop710-doc-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forms.html search-index.json troopwebhost-public-state.json
            git commit -m "Sync public TroopWebHost document links"
            git push
          else
            echo "No public-document changes."
          fi
